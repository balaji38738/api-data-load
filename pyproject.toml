[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

["project"]
name = "API-Data-Load"
version = "1.0.0"
description = "The package loads data from an API into desired file path"
readme = "README.md"
license = { text = "MIT" }
python-requires = ">=3.6"

[dependencies]
dev = ["requests"]

[project.optional-dependencies]

[project.script]
cli = "apiloader.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apiloader"]